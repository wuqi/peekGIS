<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="0.32" cy="0.26" r="1.15">
      <stop offset="0" stop-color="#3FB4C0"/>
      <stop offset="1" stop-color="#0E2A38"/>
    </radialGradient>
    <clipPath id="clip">
      <circle cx="128" cy="128" r="118"/>
    </clipPath>
  </defs>

  <circle cx="128" cy="128" r="118" fill="url(#bg)"/>

  <!-- 地图网格 -->
  <g clip-path="url(#clip)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2">
    <line x1="0"  y1="0"   x2="256" y2="0"/>
    <line x1="0"  y1="32"  x2="256" y2="32"/>
    <line x1="0"  y1="96"  x2="256" y2="96"/>
    <line x1="0"  y1="160" x2="256" y2="160"/>
    <line x1="0"  y1="224" x2="256" y2="224"/>
    <line x1="0"  y1="256" x2="256" y2="256"/>
    <line x1="0"  y1="0"   x2="0"   y2="256"/>
    <line x1="96" y1="0"   x2="96"  y2="256"/>
    <line x1="160" y1="0"  x2="160" y2="256"/>
    <line x1="256" y1="0"  x2="256" y2="256"/>
  </g>

  <!-- 取景环与十字准星 -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="128" cy="128" r="58" fill="none" stroke-width="10"/>
    <path d="M128 96 L128 160" stroke-width="10"/>
    <path d="M96 128 L160 128" stroke-width="10"/>
  </g>
</svg>